title: THE MACHINE LOG
subtitle: A research log for systems, algorithms, AI and everything in between.
description: Notes from a computer science graduate student.
keywords: null
author: Your Name
language:
  - zh-CN
  - en
timezone: Asia/Shanghai

url: http://localhost:4000
permalink: posts/:abbrlink/
permalink_defaults: {}
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: null

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map:
tag_map:

meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

per_page: 10
pagination_dir: page

include:
exclude:
ignore:

theme: the-machine-log

deploy:
  type: git
  repo: https://github.com/Just4ever-Deep/Blog_2026.git
  branch: gh-pages

abbrlink:
  alg: crc32
  rep: dec

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 200
  content_limit_delim: ' '
  order_by: -date
  icon:
  autodiscovery: true
  template:

sitemap:
  path: sitemap.xml

search:
  path: search.xml
  field: all
  content: true
  format: html
  limit: 10000
  template:

mathjax:
  tags: none
  single_dollars: true
  cjk_width: 0.9
  normal_width: 0.6
  every_page: true

marked:
  mangle: false
  headerIds: true
  gfm: true
  breaks: false
  pedantic: false
  smartLists: true
  smartypants: false
